plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.diffplug.spotless' version '6.25.0'
}


spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		eclipse().configFile("src/main/resources/eclipse-java-formatter.xml")
		indentWithSpaces(4)
		importOrder('java', 'javax', 'org', 'com', '')
		removeUnusedImports()
		endWithNewline()
		trimTrailingWhitespace()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}

group = 'team.themoment'
version = 'v20251103.0'

java {
	sourceCompatibility = '17'
}

jar {
	enabled = false
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	/** spring app **/
	implementation 'org.springframework.boot:spring-boot-starter-web'

	/** security **/
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	/** oauth 2.0 **/
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	/** persistence **/
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	runtimeOnly 'com.mysql:mysql-connector-j'

	/** queryDsl **/
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.0'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	/** test **/
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mockito:mockito-inline:4.9.0'

	/** validation **/
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	/** lombok **/
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	/** aws **/
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.4.0'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sns:3.4.0'

	/** excel **/
	implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.4.1'

	/** json **/
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation("net.minidev:json-smart:2.6.0")

	/** swagger **/
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

	/** actuator **/
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	/** micrometer **/
	implementation 'io.micrometer:micrometer-registry-prometheus'

	/** logging **/
	implementation group: 'ca.pjer', name: 'logback-awslogs-appender', version: '1.6.0'

	/** open feign **/
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

def querydslSrcDir = "$projectDir/build/generated"

clean {
	delete file(querydslSrcDir)
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory = file(querydslSrcDir)
}

tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
	useJUnitPlatform()
}

compileJava.dependsOn spotlessApply
compileTestJava.dependsOn spotlessApply
