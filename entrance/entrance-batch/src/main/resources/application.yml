# entrance-batch — CLI 배치. 웹 서버 아님, 공유 MySQL 대상(스키마는 서버가 관리하므로 DDL 금지).
spring:
  main:
    web-application-type: none
    banner-mode: "off"
  datasource:
    url: ${BATCH_DB_URL:jdbc:mysql://localhost:3306/hellogsm}
    username: ${BATCH_DB_USERNAME:root}
    password: ${BATCH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
