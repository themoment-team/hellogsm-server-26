// 공유 영속성 모듈 — server 와 entrance-batch 가 같은 JPA 엔티티를 재사용한다.
// Spring Boot 플러그인은 적용하지 않는다(라이브러리). 부트스트랩(@SpringBootApplication,
// @EnableJpaAuditing)은 소비 앱(server / entrance-batch)이 각자 켠다.
plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

group = 'team.themoment'
version = 'v20260609.0'
java.toolchain { languageVersion = JavaLanguageVersion.of(25) }

java {
	sourceCompatibility = '25'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.5"
	}
}

dependencies {
	/** persistence **/
	api 'org.springframework.boot:spring-boot-starter-data-jpa'

	/** validation **/
	api 'org.springframework.boot:spring-boot-starter-validation'

	/** json **/
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	/** queryDsl **/
	api 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	/** lombok **/
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

def querydslSrcDir = "$projectDir/build/generated"

clean {
	delete file(querydslSrcDir)
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory = file(querydslSrcDir)
}
