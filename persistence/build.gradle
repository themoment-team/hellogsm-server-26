// 공유 영속성 모듈 — server 와 entrance-batch 가 같은 JPA 엔티티를 재사용한다.
// Spring Boot 플러그인은 적용하지 않는다(라이브러리). 부트스트랩(@SpringBootApplication,
// @EnableJpaAuditing)은 소비 앱(server / entrance-batch)이 각자 켠다.
plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

group = 'team.themoment'
version = 'v20260609.0'
java.toolchain { languageVersion = JavaLanguageVersion.of(25) }

java {
	sourceCompatibility = '25'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.5"
	}
}

dependencies {
	// JPA/Hibernate/spring-data 를 소비자에게도 노출(server repo 가 Q클래스·EntityManager 사용)
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	api 'org.springframework.boot:spring-boot-starter-validation'

	// AttributeConverter(IntegerListConverter/StringListConverter)가 JSON 직렬화에 사용
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	/** queryDsl — 엔티티의 Q클래스를 이 모듈에서 생성하고 소비자에 노출한다 **/
	api 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	/** lombok — 엔티티 getter/builder 생성(컴파일 타임) **/
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

// server/build.gradle 와 동일한 Q클래스 생성 경로 규약
def querydslSrcDir = "$projectDir/build/generated"

clean {
	delete file(querydslSrcDir)
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory = file(querydslSrcDir)
}
