name: HelloGSM stage CI Workflow

on:
  pull_request:
    branches:
      - 'develop'
  push:
    branches:
      - 'develop'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make YML file
        run: touch ./server/src/main/resources/application-stage.yml

          echo "${{ secrets.STAGE_WEB_YML }}" > ./server/src/main/resources/application-stage.yml

        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build

  notify:
    runs-on: ubuntu-latest
    needs: [CI]
    if: always()

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.CI.result }}" == "failure" ]]; then
            echo "color=0xFF4C4C" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.CI.result }}" == "success" ]]; then
            echo "color=0x4CAF50" >> $GITHUB_OUTPUT
          else
            echo "color=0xFFA500" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.CI.result }}
          color: ${{ steps.status.outputs.color }}
