# entrance-lambda(모의 성적 계산)를 AWS Lambda에 배포한다. 함수 자체(실행 역할·런타임·핸들러·
# 메모리·X_HG_INTERNAL_API_KEY 환경변수·API Gateway 연결)는 이 워크플로가 만들지 않고
# Pulumi(`infra/modules/lambda.ts`)가 관리한다 — 이 워크플로는 코드만 갱신한다.
# 따라서 최초 1회는 `infra`에서 `pulumi up`을 먼저 돌려야 한다(infra/README.md 참고).
#
# 환경은 prod 단일이다. 기존 `go-hellogsm-score-calculator`에도 stage가 없었고, 점수 계산기는
# DB를 쓰지 않는 순수 함수라 stage 서버가 이 함수를 함께 호출해도 안전하다.
#
# 짝이 되는 CI 워크플로는 없다 — hellogsm-{stage,prod}-ci.yml 이 `./gradlew clean build` 로 전체
# 멀티모듈을 돌리고, entrance-lambda 는 `tasks.build.dependsOn(shadowJar)` 라 shadow jar 까지
# 거기서 검증된다. 별도 CI 를 두면 같은 빌드를 두 번 돌리는 것에 지나지 않는다.
#
# 인증은 정적 액세스키가 아니라 OIDC다 — hellogsm-prod-cd.yml과 동일한 배포 역할을 쓴다.
# 역할의 trust policy가 `sub`를 `ref:refs/heads/main`으로 고정하므로 workflow_dispatch도
# 반드시 main 브랜치를 대상으로 실행해야 한다(다른 브랜치는 AssumeRoleWithWebIdentity 거부).
#
# 필요한 GitHub 설정:
#   Variable AWS_PROD_DEPLOY_ROLE_ARN — `pulumi stack output githubActionsRoleArn`
#   Secret   AWS_REGION
#   Secret   ENTRANCE_LAMBDA_FUNCTION_NAME_PROD — `pulumi stack output entranceLambdaFunctionName`
name: entrance-lambda prod CD workflow

on:
  push:
    branches:
      - 'main'
    paths:
      - 'entrance/entrance-lambda/**'
      - 'entrance/entrance-engine/**'
      - 'entrance/entrance-plans/**'
      - 'entrance/entrance-dsl/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CD:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build shadow jar
        run: ./gradlew :entrance-lambda:shadowJar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda (prod)
        run: |
          # entrance-lambda는 일반 jar가 비활성(build.gradle.kts)이라 shadow jar 하나만 남는다.
          JAR_PATH=$(ls entrance/entrance-lambda/build/libs/*.jar)
          aws lambda update-function-code \
            --function-name "${{ secrets.ENTRANCE_LAMBDA_FUNCTION_NAME_PROD }}" \
            --zip-file "fileb://$JAR_PATH" \
            --publish
          # update-function-code는 비동기다 - 기다리지 않으면 갱신이 실패해도 CD가 초록으로 끝난다.
          aws lambda wait function-updated-v2 \
            --function-name "${{ secrets.ENTRANCE_LAMBDA_FUNCTION_NAME_PROD }}"

  notify:
    runs-on: ubuntu-latest
    needs: [CD]
    if: always()

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.CD.result }}" == "failure" ]]; then
            echo "color=0xFF4C4C" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.CD.result }}" == "success" ]]; then
            echo "color=0x4CAF50" >> $GITHUB_OUTPUT
          else
            echo "color=0xFFA500" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.CD.result }}
          color: ${{ steps.status.outputs.color }}
