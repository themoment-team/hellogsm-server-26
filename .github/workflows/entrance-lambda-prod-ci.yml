name: entrance-lambda prod CI workflow

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'entrance/entrance-lambda/**'
      - 'entrance/entrance-engine/**'
      - 'entrance/entrance-plans/**'
      - 'entrance/entrance-dsl/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/entrance-lambda-*.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'entrance/entrance-lambda/**'
      - 'entrance/entrance-engine/**'
      - 'entrance/entrance-plans/**'
      - 'entrance/entrance-dsl/**'
      - 'settings.gradle'
      - 'build.gradle'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test entrance-lambda
        run: ./gradlew :entrance-lambda:build

  notify:
    runs-on: ubuntu-latest
    needs: [CI]
    if: always()

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.CI.result }}" == "failure" ]]; then
            echo "color=0xFF4C4C" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.CI.result }}" == "success" ]]; then
            echo "color=0x4CAF50" >> $GITHUB_OUTPUT
          else
            echo "color=0xFFA500" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord Notification
        if: ${{ vars.DISCORD_NOTIFICATIONS_ENABLED == 'true' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.CI.result }}
          color: ${{ steps.status.outputs.color }}
