name: HelloGSM prod CD workflow

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CD:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make YML File
        run: touch ./src/main/resources/application-prod.yml

          echo "${{ secrets.PROD_WEB_YML }}" > ./src/main/resources/application-prod.yml

        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 인스턴스가 2대로 늘면서 HalfAtATime 롤링 배포로 바뀌어, EC2 위에서 매번 docker build를
      # 하면 교체 중인 쪽이 더 오래 비정상 상태로 남는다. 이미지를 CI에서 한 번만 빌드해 ECR에
      # push하고, 인스턴스는 appspec 훅(scripts/prod-deploy.sh)에서 pull + run만 하도록 분리한다.
      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: hello-prod-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f DockerfileProd .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Make ZIP File
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: hello-prod-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p deploy
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > deploy/ECR_IMAGE_URI.txt
          cp appspec.yml deploy/
          cp -r scripts deploy/
          cd deploy && zip -r ../$GITHUB_SHA.zip .
        shell: bash

      - name: Upload to S3
        run: aws s3 cp --region ${{ secrets.AWS_REGION }} ./$GITHUB_SHA.zip s3://${{ secrets.BUCKET_NAME }}/prod/$GITHUB_SHA.zip

      - name: Code Deploy
        run: aws deploy create-deployment --application-name hellogsm-prod-codedeploy --deployment-config-name CodeDeployDefault.HalfAtATime --deployment-group-name api-prod-hellogsm-kr --s3-location bucket=${{ secrets.BUCKET_NAME }},bundleType=zip,key=prod/$GITHUB_SHA.zip

  notify:
    runs-on: ubuntu-latest
    needs: [CD]
    if: always()

    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.CD.result }}" == "failure" ]]; then
            echo "color=0xFF4C4C" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.CD.result }}" == "success" ]]; then
            echo "color=0x4CAF50" >> $GITHUB_OUTPUT
          else
            echo "color=0xFFA500" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.CD.result }}
          color: ${{ steps.status.outputs.color }}
